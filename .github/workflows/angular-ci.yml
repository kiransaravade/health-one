name: Angular Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'client/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client/health-one-client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Packages
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload to S3
        run: |
          aws s3 sync dist/health-one-client/browser \
          s3://${{ secrets.AWS_S3_BUCKET }} \
          --delete

      - name: Show Distribution ID
        run: |
          echo "Distribution ID = '${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}'"
      
      - name: List CloudFront Distributions
        run: |
          aws cloudfront list-distributions --query "DistributionList.Items[*].[Id,DomainName]" --output table
      
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
