name: Docker CI

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  docker-build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server/HealthOne.Api

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t healthone-api .